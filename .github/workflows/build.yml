name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  repository_dispatch:
    types:
      - data-release
  schedule:
    - cron: "23 4 * * *"

concurrency:
  group: module-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    name: Check release state
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
      version_name: ${{ steps.app_version.outputs.version_name }}
      data_tag: ${{ steps.data.outputs.data_tag }}
      release_tag: ${{ steps.data.outputs.release_tag }}

    steps:
      - name: Read app version
        id: app_version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version_name="$(gh api "repos/$GITHUB_REPOSITORY/contents/app/build.gradle?ref=$GITHUB_SHA" -H "Accept: application/vnd.github.raw" | sed -n 's/^[[:space:]]*versionName[[:space:]]*"\([^"]*\)".*/\1/p' | head -n 1)"
          if [ -z "$version_name" ]; then
            echo "versionName was not found in app/build.gradle" >&2
            exit 1
          fi
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"

      - name: Resolve translation data release tag
        id: data
        env:
          GH_TOKEN: ${{ github.token }}
          PAYLOAD_TAG: ${{ github.event.client_payload.tag }}
          VERSION_NAME: ${{ steps.app_version.outputs.version_name }}
        run: |
          set -euo pipefail
          ver="${PAYLOAD_TAG:-}"
          if [ -z "$ver" ]; then
            for i in 1 2 3 4 5; do
              if ver="$(gh api repos/Project-Hoshimi/ipr-translation-data-en/releases/latest --jq .tag_name 2>/tmp/latest.err)" \
                 && [ -n "$ver" ] && [ "$ver" != "null" ]; then
                break
              fi
              echo "Attempt $i: could not read latest data release tag: $(cat /tmp/latest.err 2>/dev/null)" >&2
              ver=""
              sleep 10
            done
          fi
          if [ -z "$ver" ] || [ "$ver" = "null" ]; then echo "Could not read latest data release tag" >&2; exit 1; fi
          echo "Using data release $ver"
          echo "data_tag=$ver" >> "$GITHUB_OUTPUT"
          echo "release_tag=$VERSION_NAME-data.$ver" >> "$GITHUB_OUTPUT"

      - name: Skip if this module+data release already exists
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          TAG: ${{ steps.data.outputs.release_tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
             && [ "$EVENT_NAME" != "push" ] && [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            echo "Release $TAG already exists; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build release APKs
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK components
        run: |
          set -euo pipefail
          missing=()
          if [ ! -d "$ANDROID_HOME/platforms/android-34" ]; then missing+=("platforms;android-34"); fi
          if [ ! -d "$ANDROID_HOME/build-tools/34.0.0" ]; then missing+=("build-tools;34.0.0"); fi
          if [ ! -d "$ANDROID_HOME/ndk/26.3.11579264" ]; then missing+=("ndk;26.3.11579264"); fi
          if [ ! -d "$ANDROID_HOME/cmake/3.22.1" ]; then missing+=("cmake;3.22.1"); fi
          if [ "${#missing[@]}" -gt 0 ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "${missing[@]}"
          else
            echo "All required Android SDK components are preinstalled."
          fi

      - name: Fetch EN translation data
        env:
          GH_TOKEN: ${{ github.token }}
          DATA_TAG: ${{ needs.check.outputs.data_tag }}
        run: |
          set -euo pipefail
          echo "Using data release $DATA_TAG"
          curl -fL --retry 3 --retry-delay 5 -o /tmp/en.zip "https://github.com/Project-Hoshimi/ipr-translation-data-en/releases/download/$DATA_TAG/ipr-translation-data-en-$DATA_TAG.zip"
          mkdir -p app/src/main/assets/hoshimi-local
          unzip -qo /tmp/en.zip -d app/src/main/assets/hoshimi-local

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Restore release keystore
        env:
          HOSHIMI_RELEASE_KEYSTORE_BASE64: ${{ secrets.HOSHIMI_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$HOSHIMI_RELEASE_KEYSTORE_BASE64" ]; then
            echo "$HOSHIMI_RELEASE_KEYSTORE_BASE64" | base64 --decode > app/release.keystore
          fi

      - name: Build APKs
        env:
          HOSHIMI_RELEASE_STORE_FILE: release.keystore
          HOSHIMI_RELEASE_STORE_PASSWORD: ${{ secrets.HOSHIMI_RELEASE_STORE_PASSWORD }}
          HOSHIMI_RELEASE_KEY_ALIAS: ${{ secrets.HOSHIMI_RELEASE_KEY_ALIAS }}
          HOSHIMI_RELEASE_KEY_PASSWORD: ${{ secrets.HOSHIMI_RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Rename APKs
        env:
          TAG: ${{ needs.check.outputs.release_tag }}
        run: |
          mv app/build/outputs/apk/full/release/app-full-release.apk "HoshimiLocalify-en-full-$TAG.apk"
          mv app/build/outputs/apk/lite/release/app-lite-release.apk "HoshimiLocalify-en-lite-$TAG.apk"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.release_tag }}
          VERSION_NAME: ${{ needs.check.outputs.version_name }}
          DATA_TAG: ${{ needs.check.outputs.data_tag }}
        run: |
          set -euo pipefail
          t="$TAG"
          v="$VERSION_NAME"
          d="$DATA_TAG"
          notes="Module $v with translation data $d (commit $GITHUB_SHA)."
          files=("HoshimiLocalify-en-full-$t.apk" "HoshimiLocalify-en-lite-$t.apk")
          if gh release view "$t" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$t" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$t" --repo "$GITHUB_REPOSITORY" --notes "$notes" --latest
          else
            gh release create "$t" "${files[@]}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "$t" --notes "$notes" --latest
          fi

      - name: Prune old data releases (keep newest 7)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release list --repo "$GITHUB_REPOSITORY" --limit 300 --json tagName,publishedAt \
            --jq '[.[] | select(.tagName | contains("-data."))] | sort_by(.publishedAt) | reverse | .[7:] | .[].tagName' \
          | while read -r old; do
              case "$old" in
                *-data.*) echo "Deleting old release $old"; gh release delete "$old" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes ;;
                *) echo "Refusing to delete $old" >&2; exit 1 ;;
              esac
            done
